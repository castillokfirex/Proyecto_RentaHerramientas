services:
  mysql:
    image: mysql:8.4
    container_name: rentatools-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rentatools
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: rentatools
      MYSQL_PASSWORD: rentatools
      TZ: UTC
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-storage-engine=InnoDB
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "rentatools", "-prentatools"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
